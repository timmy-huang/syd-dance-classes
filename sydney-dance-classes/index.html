<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sydney Dance Classes</title>
    <script>
        // Handle redirects from 404.html
        (function () {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;

            // Check if we need to redirect
            var urlParams = new URLSearchParams(window.location.search);
            var path = urlParams.get('p');

            if (path) {
                // Remove the query parameter
                urlParams.delete('p');
                var newUrl = window.location.pathname;
                var search = urlParams.toString();
                if (search) newUrl += '?' + search;
                newUrl += window.location.hash;

                // Replace the current state with the target URL
                history.replaceState(null, null, newUrl);

                // Store the path to redirect to after Vue initializes
                sessionStorage.redirect = path;
            }
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
